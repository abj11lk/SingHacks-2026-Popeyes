services:
  backend:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the repo over the image's copy so edits on the host are
      # picked up immediately -- --reload restarts the server on save, no
      # rebuild needed for code changes (only for dependency changes).
      - .:/workspace
    env_file:
      - .env
    command: ["uvicorn", "backend.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
